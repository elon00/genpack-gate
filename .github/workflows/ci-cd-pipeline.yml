name: Local Artifact Gate CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and adversarial regression tests
        run: |
          python -m compileall -q sdk_contract_gate.py tests
          python tests/reality_check_harness.py
      - name: Rust scaffold compilation
        run: cargo test
